services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interviewpilot
      POSTGRES_PASSWORD: interviewpilot
      POSTGRES_DB: interviewpilot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewpilot -d interviewpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: interviewpilot-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
